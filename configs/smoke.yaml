# Smoke-test configuration: the whole pipeline on 200 molecules, CPU-only,
# in about seven minutes on a 3-core CI runner.
#
# The original target was five minutes. That turned out to be unreachable
# with a real docking oracle at 200 molecules: measured per-ligand cost is
# ~5.9s of conformer embedding plus search, so 200 molecules on 3 workers
# has a floor near 393s no matter how the smina calls are batched. The
# molecule count was kept and the budget raised, rather than shrinking the
# smoke set until a number passed.
#
# This is what CI runs and what a first-time user should run before anything
# else. Two deliberate properties:
#
#   1. CPU-only (run.device: cpu). It must work on a machine with no GPU, and
#      it must FAIL rather than silently use one, so that "the smoke test
#      passed" means the CPU path works.
#   2. Offline (data.source: csv). It reads the committed 200-molecule file
#      frozen from ChEMBL rather than querying the API, so CI does not depend
#      on the ChEMBL service or on which database release is live.
#
# The numbers this produces are NOT results. 200 molecules, 3 AL rounds and
# exhaustiveness 1 exist to exercise every code path cheaply, not to measure
# anything. Metrics from this config should never be quoted.

run:
  name: smoke
  seed: 0
  output_dir: runs
  device: cpu

data:
  source: csv
  csv_path: data/smoke/chembl_smoke_raw.csv
  smiles_column: smiles
  id_column: chembl_id
  raw_path: data/raw/smoke_raw.csv
  processed_path: data/processed/smoke_molecules.csv
  strip_salts: true
  neutralise: true
  min_heavy_atoms: 8
  max_heavy_atoms: 50

target:
  name: trypsin_3ptb
  receptor_pdb: data/targets/trypsin_3ptb/receptor_raw.pdb
  receptor_pdbqt: data/targets/trypsin_3ptb/receptor.pdbqt
  center: [-1.76, 14.46, 16.92]
  # Measured: shrinking this box from 16A to 12A changed the docking stage's
  # runtime by nothing, which is what established that smina's cost here is
  # per-invocation receptor setup rather than search volume. Kept at 14A as a
  # middle ground; the real lever is oracle.ligand_batch_size below.
  size: [14.0, 14.0, 14.0]

oracle:
  backend: smina
  smina_binary: smina
  # Minimum search effort. Scores from exhaustiveness 1 are noisy and are not
  # comparable with the default's exhaustiveness 8; the cache fingerprint
  # keeps them in a separate partition so the two can never be mixed.
  exhaustiveness: 1
  # Only the best mode is used as the regression target, and the smoke test
  # does not analyse pose spread, so generating three is wasted work here.
  num_modes: 1
  seed: 0
  n_workers: null
  # The whole 200-molecule smoke set in a handful of smina invocations
  # instead of 200 of them.
  ligand_batch_size: 25
  timeout_s: 120
  cache_path: cache/smoke_docking_cache.jsonl
  embed_max_attempts: 5
  # Conformer generation is part of the per-molecule cost, not just docking.
  ff_max_iters: 100

model:
  hidden_dim: 32
  num_layers: 2
  dropout: 0.15
  pool: mean_max
  residual: true

train:
  epochs: 8
  batch_size: 32
  lr: 0.003
  num_workers: 0
  # No GPU to pin for.
  pin_memory: false
  # Honoured but auto-disabled on CPU; kept true so the smoke test exercises
  # that branch rather than hiding it.
  amp: true
  early_stopping_patience: 8
  lr_scheduler_patience: 4

uncertainty:
  method: mc_dropout
  mc_passes: 8
  mc_chunk: 4
  ensemble_size: 2

evaluation:
  splits: [scaffold, random]
  test_frac: 0.2
  val_frac: 0.1
  # Enough resamples to exercise the code path, far too few to trust an
  # interval from.
  bootstrap_samples: 50
  bootstrap_ci: 0.95
  ef_fractions: [0.05]
  precision_k: [10]
  calibration_bins: 5

al:
  initial_size: 60
  batch_size: 30
  rounds: 3
  seeds: [0, 1]
  strategies: [uncertainty, greedy, random]
  top_k: 20
  epochs_per_round: 5
